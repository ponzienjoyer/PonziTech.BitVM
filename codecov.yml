codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
        informational: false
        only_pulls: false
        
    patch:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
        only_pulls: true
        
    changes: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree,components"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
        
  individual_components:
    - component_id: core
      name: Core Library
      paths:
        - src/PonziTech.BitVM.Core/**
      statuses:
        - type: project
          target: 85%
          threshold: 2%
          
    - component_id: bridge
      name: Bridge Library
      paths:
        - src/PonziTech.BitVM.Bridge/**
      statuses:
        - type: project
          target: 80%
          threshold: 2%
          
    - component_id: native
      name: Native Bindings
      paths:
        - src/PonziTech.BitVM.Native/**
      statuses:
        - type: project
          target: 70%
          threshold: 5%

flags:
  unit:
    paths:
      - tests/PonziTech.BitVM.UnitTests/**
    carryforward: true
    
  integration:
    paths:
      - tests/PonziTech.BitVM.IntegrationTests/**
    carryforward: true

ignore:
  - "tests/**/*"
  - "**/obj/**/*"
  - "**/bin/**/*"
  - "external/**/*"
  - "ffi/**/*"
  - "runtimes/**/*"
  - "docs/**/*"
  - "*.md"
  - "*.Designer.cs"
  - "**/*.g.cs"
  - "**/*.generated.cs"
  - "**/Migrations/**/*"
