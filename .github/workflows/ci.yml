name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
          
      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu' || matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Build FFI (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd ffi
          cargo build --release
          New-Item -ItemType Directory -Force -Path ..\runtimes\win-x64\native
          Copy-Item target\release\bitvm_ffi.dll ..\runtimes\win-x64\native\
          
      - name: Build FFI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd ffi
          cargo build --release
          mkdir -p ../runtimes/linux-x64/native
          cp target/release/libbitvm_ffi.so ../runtimes/linux-x64/native/
          
      - name: Build FFI (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd ffi
          cargo build --release
          cargo build --release --target aarch64-apple-darwin
          mkdir -p ../runtimes/osx-x64/native ../runtimes/osx-arm64/native
          cp target/release/libbitvm_ffi.dylib ../runtimes/osx-x64/native/
          cp target/aarch64-apple-darwin/release/libbitvm_ffi.dylib ../runtimes/osx-arm64/native/
          
      - name: Restore
        run: dotnet restore PonziTech.BitVM.sln /p:Platform="Any CPU"
        
      - name: Build
        run: dotnet build PonziTech.BitVM.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:Platform="Any CPU"
        
      - name: Test
        run: dotnet test PonziTech.BitVM.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal
        
      - name: Upload Native Libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries-${{ matrix.os }}
          path: runtimes/
          retention-days: 1
          if-no-files-found: warn

  pack:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
          
      - name: Download All Native Libraries
        uses: actions/download-artifact@v4
        with:
          path: runtimes
          pattern: native-libraries-*
          merge-multiple: true
          
      - name: Restore
        run: dotnet restore PonziTech.BitVM.sln /p:Platform="Any CPU"
        
      - name: Build
        run: dotnet build PonziTech.BitVM.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:Platform="Any CPU"
        
      - name: Pack
        run: dotnet pack PonziTech.BitVM.sln --configuration ${{ env.CONFIGURATION }} --no-build --output ./packages /p:Platform="Any CPU"
        
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg
          retention-days: 30
