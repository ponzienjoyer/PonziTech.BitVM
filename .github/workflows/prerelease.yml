name: Prerelease Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

permissions:
  contents: read
  packages: write

jobs:
  #############################################################################
  # Build Native Libraries - Windows
  #############################################################################
  build-native-windows:
    name: Build Native Libraries (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build FFI (Windows)
        run: |
          cd ffi
          cargo build --release
          New-Item -ItemType Directory -Force -Path ../runtimes/win-x64/native
          Copy-Item target/release/bitvm_ffi.dll ../runtimes/win-x64/native/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries-windows
          path: runtimes/win-x64/native/
          retention-days: 1

  #############################################################################
  # Build Native Libraries - Linux
  #############################################################################
  build-native-linux:
    name: Build Native Libraries (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build FFI (Linux)
        run: |
          cd ffi
          cargo build --release
          mkdir -p ../runtimes/linux-x64/native
          cp target/release/libbitvm_ffi.so ../runtimes/linux-x64/native/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries-linux
          path: runtimes/linux-x64/native/
          retention-days: 1

  #############################################################################
  # Build Native Libraries - macOS
  #############################################################################
  build-native-macos:
    name: Build Native Libraries (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build FFI (macOS)
        run: |
          cd ffi
          cargo build --release
          cargo build --release --target aarch64-apple-darwin
          mkdir -p ../runtimes/osx-x64/native ../runtimes/osx-arm64/native
          cp target/release/libbitvm_ffi.dylib ../runtimes/osx-x64/native/
          cp target/aarch64-apple-darwin/release/libbitvm_ffi.dylib ../runtimes/osx-arm64/native/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries-macos
          path: runtimes/
          retention-days: 1

  #############################################################################
  # Build and Pack Prerelease
  #############################################################################
  build-and-pack:
    name: Build and Pack Prerelease Packages
    needs: [build-native-windows, build-native-linux, build-native-macos]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Windows native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libraries-windows
          path: runtimes/win-x64/native/

      - name: Download Linux native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libraries-linux
          path: runtimes/linux-x64/native/

      - name: Download macOS native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libraries-macos
          path: runtimes/

      - name: Verify all native libraries are present
        run: |
          echo "Native libraries available for packaging:"
          find runtimes -type f -name "*.dll" -o -name "*.so" -o -name "*.dylib" | sort

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Generate Prerelease Version
        id: version
        run: |
          BASE_VERSION="0.1.0"
          BUILD_NUMBER="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          
          # Simple prerelease: 0.1.0-alpha.{build}+sha
          VERSION="${BASE_VERSION}-alpha.${BUILD_NUMBER}+${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated prerelease version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore PonziTech.BitVM.sln /p:Platform="Any CPU"

      - name: Build solution
        run: dotnet build PonziTech.BitVM.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:Platform="Any CPU"

      - name: Pack Prerelease Packages
        run: |
          dotnet pack PonziTech.BitVM.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./artifacts/pkg \
            /p:Platform="Any CPU" \
            /p:Version=${{ steps.version.outputs.version }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-packages
          path: artifacts/pkg/*.nupkg
          retention-days: 30

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-symbols
          path: artifacts/pkg/*.snupkg
          retention-days: 30

  #############################################################################
  # Publish to GitHub Packages
  #############################################################################
  publish-github:
    name: Publish Prerelease to GitHub Packages
    needs: build-and-pack
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: prerelease-packages
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Output package info
        run: |
          echo "Published prerelease packages to GitHub Packages:"
          ls -la ./packages/*.nupkg
          echo ""
          echo "Install with:"
          echo "dotnet add package PonziTech.BitVM.Core --version ${{ needs.build-and-pack.outputs.version }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
