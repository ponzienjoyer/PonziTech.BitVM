name: Prerelease Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

permissions:
  contents: read
  packages: write

jobs:
  #############################################################################
  # Build Native Libraries (Windows)
  #############################################################################
  build-native:
    name: Build Native Libraries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build FFI
        run: |
          cd ffi
          cargo build --release

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: ffi/target/release/bitvm_ffi.dll
          retention-days: 1

  #############################################################################
  # Build and Pack Prerelease
  #############################################################################
  build-and-pack:
    name: Build and Pack Prerelease Packages
    needs: build-native
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: runtimes/win-x64/native/

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Generate Prerelease Version
        id: version
        run: |
          BASE_VERSION="0.1.0"
          BUILD_NUMBER="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          
          # Simple prerelease: 0.1.0-alpha.{build}+sha
          VERSION="${BASE_VERSION}-alpha.${BUILD_NUMBER}+${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated prerelease version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore PonziTech.BitVM.sln /p:Platform="Any CPU"

      - name: Build solution
        run: dotnet build PonziTech.BitVM.sln --configuration ${{ env.CONFIGURATION }} --no-restore /p:Platform="Any CPU"

      - name: Run tests
        run: |
          dotnet test PonziTech.BitVM.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal

      - name: Pack Prerelease Packages
        run: |
          dotnet pack PonziTech.BitVM.sln \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./artifacts/pkg \
            /p:Platform="Any CPU" \
            /p:Version=${{ steps.version.outputs.version }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-packages
          path: artifacts/pkg/*.nupkg
          retention-days: 30

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-symbols
          path: artifacts/pkg/*.snupkg
          retention-days: 30

  #############################################################################
  # Publish to GitHub Packages
  #############################################################################
  publish-github:
    name: Publish Prerelease to GitHub Packages
    needs: build-and-pack
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: prerelease-packages
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Output package info
        run: |
          echo "Published prerelease packages to GitHub Packages:"
          ls -la ./packages/*.nupkg
          echo ""
          echo "Install with:"
          echo "dotnet add package PonziTech.BitVM.Core --version ${{ needs.build-and-pack.outputs.version }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
